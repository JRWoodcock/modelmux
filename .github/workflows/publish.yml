name: Publish to npm

# Publishes modelmux to npm using npm Trusted Publishing (OIDC) — no stored
# token. GitHub's OIDC identity is exchanged for short-lived publish
# credentials, and build provenance is attached automatically.
#
# Trigger: when a GitHub Release is published, or manually from the Actions tab.
#
# Requires a matching Trusted Publisher configured on npmjs.com under the
# package's settings → "Trusted Publisher" → GitHub Actions:
#   Organization or user: JRWoodcock
#   Repository:           modelmux
#   Workflow filename:    publish.yml

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1; setup-node ships an older line.
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest

      - name: Publish (OIDC, public, with provenance)
        run: npm publish --access public
